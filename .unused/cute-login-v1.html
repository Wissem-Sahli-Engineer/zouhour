<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome back!</title>
<style>
  :root{
    --purple:#8B5CF6;
    --pink:#EC4899;
    --yellow:#F5D033;
    --orange:#F0924B;
    --ink:#1a1a1a;
    --muted:#8a8a8f;
    --line:#e7e7ea;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#e9e9ec;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  .card{
    display:flex;
    width:920px;
    max-width:94vw;
    height:560px;
    max-height:90vh;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.25);
  }

  /* ---------- LEFT: character stage ---------- */
  .stage{
    flex:1;
    background:#f4f4f6;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.6), transparent 60%);
  }

  .cast{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:-10px;
    padding-bottom:70px;
    transform-style:preserve-3d;
  }

  .char{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:floaty 3.2s ease-in-out infinite;
    transition:transform .12s ease-out;
    will-change:transform;
  }
  .char .body{
    position:relative;
    transition:filter .15s ease;
  }
  .char.shake{ animation:floaty 3.2s ease-in-out infinite, shakeMove .45s ease; }
  .char.nod{ animation:floaty 3.2s ease-in-out infinite, nodMove .6s ease; }

  @keyframes floaty{
    0%,100%{ margin-bottom:0px; }
    50%{ margin-bottom:16px; }
  }
  @keyframes shakeMove{
    0%,100%{ margin-left:0; }
    20%{ margin-left:-10px; }
    40%{ margin-left:10px; }
    60%{ margin-left:-8px; }
    80%{ margin-left:8px; }
  }
  @keyframes nodMove{
    0%,100%{ margin-top:0; }
    30%{ margin-top:14px; }
    60%{ margin-top:-6px; }
  }

  #purple{ margin:0 -14px; z-index:3; animation-delay:0s; }
  #pink{ margin:0 -14px; z-index:2; animation-delay:.4s; }
  #yellow{ margin:0 -14px; z-index:1; animation-delay:.8s; }
  #orange{ margin:0 -18px; z-index:4; animation-delay:1.1s; }

  .body-purple{
    width:120px; height:210px;
    background:linear-gradient(160deg,#9d6bfa,#7c4de0);
    border-radius:34px;
  }
  .body-pink{
    width:88px; height:150px;
    background:linear-gradient(160deg,#f472b6,#db2777);
    border-radius:30px;
  }
  .body-yellow{
    width:96px; height:118px;
    background:linear-gradient(160deg,#fde047,#eab308);
    border-radius:26px;
  }
  .body-orange{
    width:170px; height:100px;
    background:linear-gradient(160deg,#fb923c,#ea580c);
    border-radius:100px 100px 24px 24px;
  }

  .eyes{
    position:absolute;
    top:34%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:14px;
  }
  #orange .eyes{ top:46%; gap:22px; }
  #yellow .eyes{ top:32%; }

  .eye{
    width:16px; height:16px;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .pupil{
    width:7px; height:7px;
    background:#1a1a1a;
    border-radius:50%;
    transform:translate(0,0);
    transition:transform .03s linear;
  }

  .mouth{
    position:absolute;
    background:#1a1a1a;
    border-radius:3px;
  }
  #purple .mouth{ top:52%; left:50%; width:20px; height:3px; transform:translateX(-50%); border-radius:0 0 10px 10px; }
  #pink .mouth{ top:48%; left:50%; width:16px; height:3px; transform:translateX(-50%); }
  #yellow .mouth{ top:50%; left:50%; width:22px; height:3px; transform:translateX(-50%); }
  #orange .mouth{ top:62%; left:50%; width:26px; height:3px; transform:translateX(-50%); }

  .ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height:60px;
    background:linear-gradient(to top, rgba(0,0,0,.06), transparent);
  }

  /* ---------- RIGHT: form ---------- */
  .panel{
    width:360px;
    flex-shrink:0;
    padding:56px 44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo{
    width:34px; height:34px;
    margin-bottom:22px;
    color:var(--ink);
  }
  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .sub{
    margin:0 0 30px;
    font-size:13.5px;
    color:var(--muted);
  }

  form{ width:100%; text-align:left; }

  .field{
    margin-bottom:20px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink);
    margin-bottom:6px;
    font-weight:600;
  }
  .field-input{
    position:relative;
    display:flex;
    align-items:center;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line);
    padding:6px 26px 8px 0;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    background:transparent;
    transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--purple); }
  .field.error input{ border-color:#e0455f; }
  .field.error label{ color:#e0455f; }

  .eye-toggle{
    position:absolute;
    right:0;
    cursor:pointer;
    color:#b6b6bd;
    background:none;
    border:none;
    padding:4px;
    display:flex;
  }
  .eye-toggle svg{ width:18px; height:18px; }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 0 26px;
    font-size:12.5px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
  }
  .remember input{ accent-color:var(--purple); width:14px; height:14px; }
  .forgot{
    color:var(--muted);
    text-decoration:none;
    cursor:pointer;
    background:none;
    border:none;
    font-size:12.5px;
    padding:0;
  }
  .forgot:hover{ color:var(--purple); }

  .btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, opacity .15s ease;
    position:relative;
  }
  .btn:active{ transform:scale(.98); }
  .btn:hover{ background:#000; }
  .btn.loading{ color:transparent; pointer-events:none; }
  .btn.loading::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:16px; height:16px;
    margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .btn-google{
    width:100%;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .btn-google:hover{ background:#f7f7f8; border-color:#d9d9de; }
  .btn-google svg{ width:16px; height:16px; }

  .signup{
    margin-top:26px;
    font-size:13px;
    color:var(--muted);
  }
  .signup a, .signup button{
    color:var(--ink);
    font-weight:600;
    text-decoration:none;
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:0;
  }
  .signup button:hover{ text-decoration:underline; }

  .msg{
    min-height:18px;
    font-size:12.5px;
    margin-bottom:12px;
    text-align:center;
  }
  .msg.err{ color:#e0455f; }
  .msg.ok{ color:#12a150; }

  .toast{
    position:fixed;
    top:24px; left:50%;
    transform:translate(-50%,-140%);
    background:var(--ink);
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .toast.show{ transform:translate(-50%,0); }
  .toast.err{ background:#e0455f; }
  .toast.ok{ background:#12a150; }

  @media (max-width:720px){
    .card{ flex-direction:column; height:auto; width:94vw; }
    .stage{ width:100%; height:220px; }
    .panel{ width:100%; padding:34px 28px; }
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">

  <!-- LEFT: characters -->
  <div class="stage" id="stage">
    <div class="cast" id="cast">
      <div class="char" id="orange">
        <div class="body body-orange"></div>
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="char" id="purple">
        <div class="body body-purple"></div>
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="char" id="pink">
        <div class="body body-pink"></div>
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="char" id="yellow">
        <div class="body body-yellow"></div>
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="ground"></div>
  </div>

  <!-- RIGHT: form -->
  <div class="panel">
    <svg class="logo" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L2 8l10 6 10-6-10-6z" fill="currentColor"/>
      <path d="M2 16l10 6 10-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 11l10 6 10-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Welcome back!</h1>
    <p class="sub">Please enter your details</p>

    <form id="loginForm" novalidate>
      <div class="msg" id="msg"></div>

      <div class="field" id="emailField">
        <label for="email">Email</label>
        <div class="field-input">
          <input type="text" id="email" autocomplete="username" placeholder="you@example.com">
        </div>
      </div>

      <div class="field" id="passField">
        <label for="password">Password</label>
        <div class="field-input">
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="eye-toggle" id="toggleEye" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
        <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="btn" id="loginBtn">Log in</button>
      <button type="button" class="btn-google" id="googleBtn">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.6 5.4C41.5 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Log in with Google
      </button>
    </form>

    <p class="signup">Don't have an account? <button type="button" id="signupBtn">Sign Up</button></p>
  </div>
</div>

<script>
/* ---------------- Eye tracking + tilt + float (mouse-reactive) ---------------- */
const stage = document.getElementById('stage');
const chars = Array.from(document.querySelectorAll('.char'));

document.addEventListener('mousemove', (e) => {
  chars.forEach(char => {
    const body = char.querySelector('.body');
    const rect = body.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    // pupils follow cursor
    const pupils = char.querySelectorAll('.pupil');
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.min(Math.hypot(dx, dy) / 40, 3.4);
    const angle = Math.atan2(dy, dx);
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;
    pupils.forEach(p => { p.style.transform = `translate(${px}px, ${py}px)`; });

    // body tilts toward cursor
    const tiltX = Math.max(-12, Math.min(12, dx / 40));
    const tiltY = Math.max(-8, Math.min(8, -dy / 60));
    body.style.transform = `rotate(${tiltX}deg) rotateX(${tiltY}deg)`;
  });
});

/* touch support: tilt/track toward the last touch point */
document.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (!t) return;
  const evt = new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY });
  document.dispatchEvent(evt);
}, { passive: true });

/* ---------------- Login logic ---------------- */
const form = document.getElementById('loginForm');
const emailField = document.getElementById('emailField');
const passField = document.getElementById('passField');
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const msg = document.getElementById('msg');
const toast = document.getElementById('toast');

function showToast(text, type){
  toast.textContent = text;
  toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.className = 'toast ' + type; }, 2400);
}

function playReaction(kind){
  chars.forEach(char => {
    char.classList.remove('shake', 'nod');
    void char.offsetWidth; // restart animation
    char.classList.add(kind);
    setTimeout(() => char.classList.remove(kind), 700);
  });
}

function setError(field, on){
  field.classList.toggle('error', on);
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

// demo "database" — replace with a real backend call
const DEMO_ACCOUNT = { email: 'demo@example.com', password: 'password123' };

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const emailVal = emailInput.value.trim();
  const passVal = passInput.value;

  setError(emailField, false);
  setError(passField, false);
  msg.textContent = '';
  msg.className = 'msg';

  let hasError = false;

  if (!isValidEmail(emailVal)) {
    setError(emailField, true);
    hasError = true;
  }
  if (passVal.length < 6) {
    setError(passField, true);
    hasError = true;
  }

  if (hasError) {
    msg.textContent = 'Please enter a valid email and a password of at least 6 characters.';
    msg.className = 'msg err';
    playReaction('shake');
    showToast('Please check your details', 'err');
    return;
  }

  // simulate an async credential check
  loginBtn.classList.add('loading');
  setTimeout(() => {
    loginBtn.classList.remove('loading');
    const ok = emailVal === DEMO_ACCOUNT.email && passVal === DEMO_ACCOUNT.password;

    if (ok) {
      msg.textContent = 'Login successful!';
      msg.className = 'msg ok';
      playReaction('nod');
      showToast('Welcome back!', 'ok');
    } else {
      setError(emailField, true);
      setError(passField, true);
      msg.textContent = 'Incorrect email or password. Try demo@example.com / password123.';
      msg.className = 'msg err';
      playReaction('shake');
      showToast('Incorrect email or password', 'err');
    }
  }, 700);
});

document.getElementById('toggleEye').addEventListener('click', () => {
  const isPw = passInput.type === 'password';
  passInput.type = isPw ? 'text' : 'password';
});

document.getElementById('forgotBtn').addEventListener('click', () => {
  showToast('Password reset link sent (demo)', 'ok');
});

document.getElementById('signupBtn').addEventListener('click', () => {
  showToast('Sign up flow (demo)', 'ok');
});

document.getElementById('googleBtn').addEventListener('click', () => {
  showToast('Google login (demo)', 'ok');
  playReaction('nod');
});
</script>
</body>
</html>
