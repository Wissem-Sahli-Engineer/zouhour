<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Information Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }

      .card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
      }

      .image-section {
        text-align: center;
        margin-bottom: 30px;
      }

      .preview {
        width: 220px;
        height: 140px;
        object-fit: cover;
        border: 2px dashed #9ca3af;
        border-radius: 10px;
        display: block;
        margin: 0 auto 15px;
        background: #f9fafb;
      }

      .image-input {
        display: inline-block;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
      }

      input,
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      button {
        margin-top: 25px;
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      @media (max-width: 650px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .field.full {
          grid-column: auto;
        }

        .container {
          margin: 15px auto;
          padding: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>Document Information</h1>

        <p id="status"></p>

        <!-- Image upload / preview -->
        <div class="image-section">
          <img
            id="imagePreview"
            class="preview"
            src="https://via.placeholder.com/220x140?text=Image"
            alt="Image preview"
          />

          <input
            class="image-input"
            type="file"
            id="image"
            name="image"
            accept="image/*"
          />
        </div>

        <form id="documentForm">
          <div class="form-grid">
            <div class="field">
              <label for="country">country</label>
              <input type="text" id="country" name="country" />
            </div>

            <div class="field">
              <label for="passport_number">passport_number</label>
              <input type="text" id="passport_number" name="passport_number" />
            </div>

            <div class="field">
              <label for="type">type</label>
              <input type="text" id="type" name="type" />
            </div>

            <div class="field">
              <label for="nationality">nationality</label>
              <input type="text" id="nationality" name="nationality" />
            </div>

            <div class="field">
              <label for="given_name">given_name</label>
              <input type="text" id="given_name" name="given_name" />
            </div>

            <div class="field">
              <label for="surname">surname</label>
              <input type="text" id="surname" name="surname" />
            </div>

            <div class="field">
              <label for="date_of_birth">date_of_birth</label>
              <input type="date" id="date_of_birth" name="date_of_birth" />
            </div>

            <div class="field">
              <label for="sex">sex</label>
              <select id="sex" name="sex">
                <option value="">Select</option>
                <option value="M">M</option>
                <option value="F">F</option>
                <option value="X">X</option>
              </select>
            </div>

            <div class="field">
              <label for="place_of_birth">place_of_birth</label>
              <input type="text" id="place_of_birth" name="place_of_birth" />
            </div>

            <div class="field">
              <label for="date_of_issue">date_of_issue</label>
              <input type="date" id="date_of_issue" name="date_of_issue" />
            </div>

            <div class="field">
              <label for="date_of_expiry">date_of_expiry</label>
              <input type="date" id="date_of_expiry" name="date_of_expiry" />
            </div>

            <div class="field">
              <label for="issued_by">issued_by</label>
              <input type="text" id="issued_by" name="issued_by" />
            </div>
          </div>

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script>
      const imageInput = document.getElementById("image");
      const imagePreview = document.getElementById("imagePreview");

      imageInput.addEventListener("change", async function () {
        const file = this.files[0];

        if (!file) {
          return;
        }

        // Show image immediately
        imagePreview.src = URL.createObjectURL(file);

        // Show loading state
        document.getElementById("status").textContent =
          "Extracting passport information...";

        const formData = new FormData();

        formData.append("file", file);

        try {
          const response = await fetch("http://localhost:8001/extract", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error("Extraction failed");
          }

          const data = await response.json();

          console.log("Extracted data:", data);

          // Fill the form
          document.getElementById("country").value = data.country || "";

          document.getElementById("passport_number").value =
            data.passport_number || "";

          document.getElementById("type").value = data.type || "";

          document.getElementById("nationality").value = data.nationality || "";

          document.getElementById("given_name").value = data.given_name || "";

          document.getElementById("surname").value = data.surname || "";

          document.getElementById("date_of_birth").value =
            data.date_of_birth || "";

          document.getElementById("sex").value = data.sex || "";

          document.getElementById("place_of_birth").value =
            data.place_of_birth || "";

          document.getElementById("date_of_issue").value =
            data.date_of_issue || "";

          document.getElementById("date_of_expiry").value =
            data.date_of_expiry || "";

          document.getElementById("issued_by").value = data.issued_by || "";

          document.getElementById("status").textContent =
            "Information extracted successfully.";
        } catch (error) {
          console.error(error);

          document.getElementById("status").textContent =
            "Could not extract information from the image.";
        }
      });
    </script>
  </body>
</html>
